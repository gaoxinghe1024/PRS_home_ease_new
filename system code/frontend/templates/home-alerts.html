<div class="home-help-row"><button class="button danger" id="elderHelp"><i data-lucide="bell-ring"></i><strong>I need help</strong><span id="elderHelpSub">Contact my caregiver</span></button><div class="elder-help-confirm" id="helpConfirm" hidden><i data-lucide="circle-check"></i><strong>Help request sent</strong></div></div>
<section class="elder-event home-event" id="elderEvent" hidden role="alert">
  <div class="section-heading"><h2>Please confirm how you are</h2><span class="badge amber" id="elderEventMode"></span></div><p id="elderEventText"></p>
  <div class="elder-responses"><button class="button secondary" id="elderSafe"><i data-lucide="circle-check"></i>I'm OK</button><button class="button primary" id="elderInquiry"><i data-lucide="mic"></i>Answer by voice</button><button class="button danger-outline" id="elderWithdraw" hidden><i data-lucide="rotate-ccw"></i><span id="elderWithdrawText">Withdraw call for help</span></button></div>
  <p class="muted small" id="elderWithdrawHint" hidden>If this was a mistake, tap "Withdraw call for help".</p>
  <div id="inquiryProgress" class="inquiry-progress" hidden><strong id="inquiryStatus">Asking</strong><span id="inquiryQuestion" class="muted" hidden></span><span id="inquiryCountdown"></span><progress id="inquiryBar" value="0" max="10"></progress></div><p id="elderInquiryResult" class="elder-response-result" hidden></p>
</section>
