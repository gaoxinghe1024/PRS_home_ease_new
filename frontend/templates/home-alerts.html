<div class="home-help-row"><button class="button danger" id="elderHelp"><i data-lucide="bell-ring"></i><strong>我需要帮助</strong><span id="elderHelpSub">联系我的照护者</span></button><div class="elder-help-confirm" id="helpConfirm" hidden><i data-lucide="circle-check"></i><strong>求助已发出</strong></div></div>
