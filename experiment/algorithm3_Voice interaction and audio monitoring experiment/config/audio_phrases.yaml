  - {id: vis-en-help-001, text: "She fell down!", lang: en, intent: HELP, speaker_role: visitor, family: vis-en-help-f01, split: dev}
  - {id: vis-en-help-002, text: "Grandma has fallen", lang: en, intent: HELP, speaker_role: visitor, family: vis-en-help-f01, split: dev}
