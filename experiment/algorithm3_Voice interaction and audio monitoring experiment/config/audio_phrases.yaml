# Phrase bank for the spoken-reply experiments (A3b) and for intent training/evaluation.
# schema_version 1. Original text written for this project; no quotes from real shows, no real people.
#
# Fields
#   id            unique id: <role>-<lang>-<intent>-<nnn>
#   text          what is said (the TTS input; punctuation is ignored by the intent code)
#   lang          en | zh
#   intent        HELP | REASSURANCE | OTHER   = what the WORDS mean, whoever says them
#   speaker_role  self (the monitored person) | visitor (another person present) | tv (TV or radio speech)
#   family        paraphrase family; a family lives in exactly ONE split (no near-duplicate across splits)
#   split         dev (develop and choose settings) | test (report once)
#
# Labelling conventions
#   * Mixed sentences ("I'm fine but I can't get up") are HELP: any help cue wins over reassurance.
#   * Negated wellbeing ("I'm not okay") is HELP; negated pain ("I'm not hurt", "\u4e00\u70b9\u513f\u4e5f\u4e0d\u75bc") is REASSURANCE.
#   * Bare yes / no, hesitation, questions, requests and off-topic talk are OTHER (no context-dependent reading of "yes").
#   * A visitor or TV line carries the same label as its words; whether it came from the monitored person is a separate question
#     (speaker verification, later step) and is NOT encoded in `intent`.
# Validation: homeease.ml.audio.phrases.load_phrase_bank (schema, unique ids/texts, family-split rule, count rules).
schema_version: 1
