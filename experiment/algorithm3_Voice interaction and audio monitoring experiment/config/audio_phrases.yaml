  - {id: tv-en-reas-009, text: "The situation is under control", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f05, split: test}
  - {id: tv-en-reas-010, text: "The passengers are unharmed", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f05, split: test}
  - {id: tv-en-reas-011, text: "I'm doing fine, thank you for asking", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f06, split: test}
  - {id: tv-en-reas-012, text: "There is nothing to worry about", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f06, split: test}
  # ---- tv / en / OTHER
  - {id: tv-en-othe-001, text: "Tomorrow will be cloudy with scattered showers", lang: en, intent: OTHER, speaker_role: tv, family: tv-en-othe-f01, split: dev}
