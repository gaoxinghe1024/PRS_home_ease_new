  # ---- tv / en / HELP
  - {id: tv-en-help-001, text: "Help! Somebody help us!", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f01, split: dev}
  - {id: tv-en-help-002, text: "Please, someone help him", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f01, split: dev}
  - {id: tv-en-help-003, text: "Call an ambulance, hurry!", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f02, split: dev}
  - {id: tv-en-help-004, text: "Get a doctor, quickly", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f02, split: dev}
  - {id: tv-en-help-005, text: "He's collapsed, he can't get up!", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f03, split: dev}
  - {id: tv-en-help-006, text: "She fell from the ladder", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f03, split: dev}
  - {id: tv-en-help-007, text: "Over here, we need help!", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f04, split: test}
  - {id: tv-en-help-008, text: "Is anyone out there? Help us!", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f04, split: test}
  - {id: tv-en-help-009, text: "Send an ambulance to the harbour", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f05, split: test}
  - {id: tv-en-help-010, text: "The paramedics must come now", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f05, split: test}
  - {id: tv-en-help-011, text: "The old man has fallen on the stairs", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f06, split: test}
  - {id: tv-en-help-012, text: "She is hurt, she can't stand", lang: en, intent: HELP, speaker_role: tv, family: tv-en-help-f06, split: test}
  # ---- tv / en / REASSURANCE
  - {id: tv-en-reas-001, text: "It's all right, I'm fine", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f01, split: dev}
  - {id: tv-en-reas-002, text: "Don't worry, nobody is hurt", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f01, split: dev}
  - {id: tv-en-reas-003, text: "Everything is okay now", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f02, split: dev}
  - {id: tv-en-reas-004, text: "They are safe and well", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f02, split: dev}
  - {id: tv-en-reas-005, text: "No problem, we are fine here", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f03, split: dev}
  - {id: tv-en-reas-006, text: "He said he is okay", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f03, split: dev}
  - {id: tv-en-reas-007, text: "Relax, I'm not hurt at all", lang: en, intent: REASSURANCE, speaker_role: tv, family: tv-en-reas-f04, split: test}
