  - {id: vis-en-help-008, text: "He slipped in the kitchen, come quickly", lang: en, intent: HELP, speaker_role: visitor, family: vis-en-help-f04, split: test}
  - {id: vis-en-help-009, text: "She says she can't move her leg", lang: en, intent: HELP, speaker_role: visitor, family: vis-en-help-f05, split: test}
