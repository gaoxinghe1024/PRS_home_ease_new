[project]
name = "homeease"
version = "0.1.0"
description = "Algorithm 3 experiments: voice interaction and audio monitoring (NUS PRS Group 10)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "opencv-python>=4.10",
  "mediapipe>=0.10.14",
  "torch>=2.3",
  "httpx>=0.27",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "cryptography>=42",
  "pywebpush>=2.0",
  "tzdata>=2024.1; sys_platform == 'win32'",  # Windows ships no IANA time-zone database (zoneinfo needs it)
]

[project.optional-dependencies]
audio = [
  "soundfile>=0.12",
  "sounddevice>=0.4",
  "faster-whisper>=1.1",
  "silero-vad>=5.1",
  "webrtcvad-wheels>=2.0.14",
  "onnxruntime>=1.18",
]
# Experiment A6 only (many synthetic speakers saying the same words): piper-tts is GPL-3.0-or-later, so it is not a dependency of the other experiments.
audio-tts = ["piper-tts>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 300
markers = [
  "slow: long-running tests (training, real data)",
  "realdata: requires downloaded datasets",
]
